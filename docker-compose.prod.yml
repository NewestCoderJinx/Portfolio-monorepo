services:
  postgres:
    image: postgres:15-alpine
    container_name: portfolio_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-portfolio_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-portfolio_db}
    # No published port: only the api container reaches the database, over the compose network.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    container_name: portfolio_api
    restart: always
    # No published port: browsers reach the API through nginx at /api/.
    environment:
      NODE_ENV: production
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-portfolio_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-portfolio_db}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      # nginx in the web container is the one proxy in front of the API. Use 2 if another proxy
      # (e.g. a TLS terminator on the host) sits in front of nginx.
      TRUST_PROXY: ${TRUST_PROXY:-1}
      # Only needed if another site's pages call this API; the portfolio itself goes through /api/.
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
      # Public address used in /p/<id> share links; falls back to the request host when empty.
      SITE_URL: ${SITE_URL:-${VITE_SITE_URL:-}}
      # Email alerts for new contact messages; leave SMTP_HOST empty to turn them off.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      NOTIFY_EMAIL: ${NOTIFY_EMAIL:-}
    volumes:
      - ./api/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./web
      args:
        # Empty: the browser calls /api on the site's own address.
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_SITE_TITLE: ${VITE_SITE_TITLE:-}
        VITE_SITE_DESCRIPTION: ${VITE_SITE_DESCRIPTION:-}
        VITE_SITE_URL: ${VITE_SITE_URL:-}
        VITE_OG_IMAGE: ${VITE_OG_IMAGE:-}
    container_name: portfolio_web
    restart: always
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - api

volumes:
  postgres_data:
