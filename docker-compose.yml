services:
  postgres:
    image: postgres:15-alpine
    container_name: portfolio_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-portfolio_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-portfolio_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    container_name: portfolio_api
    restart: always
    ports:
      - "3000:3000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-portfolio_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-portfolio_db}
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key}
      DB_SYNCHRONIZE: "true"
      # Public address used in /p/<id> share links; falls back to the request host when empty.
      SITE_URL: ${SITE_URL:-${VITE_SITE_URL:-}}
    volumes:
      - ./api/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./web
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
        VITE_SITE_TITLE: ${VITE_SITE_TITLE:-}
        VITE_SITE_DESCRIPTION: ${VITE_SITE_DESCRIPTION:-}
        VITE_SITE_URL: ${VITE_SITE_URL:-}
        VITE_OG_IMAGE: ${VITE_OG_IMAGE:-}
    container_name: portfolio_web
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  postgres_data:
