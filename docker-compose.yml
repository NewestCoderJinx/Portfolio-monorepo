version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: portfolio_db
    restart: always
    environment:
      POSTGRES_USER: portfolio_user
      POSTGRES_PASSWORD: secret_password
      POSTGRES_DB: portfolio_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: ./api
    container_name: portfolio_api
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: portfolio_user
      DATABASE_PASSWORD: secret_password
      DATABASE_NAME: portfolio_db
      JWT_SECRET: super_secret_jwt_key
    volumes:
      - ./api/uploads:/usr/src/app/uploads
    depends_on:
      - postgres

  web:
    build: ./web
    container_name: portfolio_web
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  postgres_data: