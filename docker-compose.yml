version: '3.8'

services:
  # NestJS Backend API Service
  api:
    build: ./api
    ports:
      - "3000:3000"
    volumes:
      - ./api/uploads:/usr/src/app/uploads  # PostgreSQL Database Service
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgrespassword
      DATABASE_NAME: portfoliodb
      JWT_SECRET: supersecretjwtkey
      PORT: 3000
    depends_on:
      - postgres
  postgres:
    image: postgres:15-alpine
    container_name: portfolio_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: portfoliodb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data


  # NestJS Backend API Service
  
  # React Vite Frontend Service
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: portfolio_web
    restart: always
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  pgdata: