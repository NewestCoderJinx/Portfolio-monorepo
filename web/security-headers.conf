# Security headers for every response. Included at server level and again in each location that sets
# its own add_header, because nginx drops the server-level ones there.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
# No script rules: share pages forward with an inline script, and covers can be images from any site.
add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
# HTTPS-only (Strict-Transport-Security) belongs with the TLS setup, once the site is served over https.
