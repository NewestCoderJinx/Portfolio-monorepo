# Link-preview crawlers that don't run JavaScript. Search engines (Googlebot, Bingbot) are left out on
# purpose: they render the app and should index the real page.
map $http_user_agent $preview_crawler {
    default 0;
    "~*(facebookexternalhit|facebookcatalog|twitterbot|linkedinbot|slackbot|slack-imgproxy|discordbot|telegrambot|whatsapp|skypeuripreview|pinterest|redditbot|embedly|vkshare|iframely|mastodon|bluesky|cardyb)" 1;
}

server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy API requests to NestJS
    location /api/ {
        # Uploads: images up to 15 MB (resized by the API), résumé PDFs up to 10 MB. nginx's default is 1 MB.
        client_max_body_size 16m;
        proxy_pass http://api:3000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Share links (/p/<project id>): a page with that project's link-preview tags, which forwards to the case study.
    location /p/ {
        proxy_pass http://api:3000/share/projects/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Blog posts (/blog/<slug>): preview crawlers get a page with the post's preview tags from the API;
    # everyone else gets the app. The /blog list itself falls through to "location /".
    location ~ ^/blog/[^/]+/?$ {
        root /usr/share/nginx/html;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        if ($preview_crawler) {
            rewrite ^/blog/([^/]+)/?$ /share/posts/$1 break;
            proxy_pass http://api:3000;
        }
        try_files $uri /index.html;
    }

    # Proxy static image uploads served by NestJS
    location /uploads/ {
        proxy_pass http://api:3000/uploads/;
    }
}