# Link-preview crawlers that don't run JavaScript. Search engines (Googlebot, Bingbot) are left out on
# purpose: they render the app and should index the real page.
map $http_user_agent $preview_crawler {
    default 0;
    "~*(facebookexternalhit|facebookcatalog|twitterbot|linkedinbot|slackbot|slack-imgproxy|discordbot|telegrambot|whatsapp|skypeuripreview|pinterest|redditbot|embedly|vkshare|iframely|mastodon|bluesky|cardyb)" 1;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    # Don't advertise the nginx version in headers and error pages.
    server_tokens off;
    include /etc/nginx/snippets/security-headers.conf;

    # Compress text responses, including the API's JSON. Images are already compressed.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/css text/plain text/xml application/javascript application/json application/xml image/svg+xml;

    location / {
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Built JS and CSS have a content hash in their names, so a new build gets new URLs and these
    # can be cached for good. A missing file is a 404, not the app page.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # The app page must always be checked, so visitors pick up a new build straight away.
    # Every page route ends up here through try_files.
    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Reverse proxy API requests to NestJS
    location /api/ {
        # Uploads: images up to 15 MB (resized by the API), résumé PDFs up to 10 MB. nginx's default is 1 MB.
        client_max_body_size 16m;
        proxy_pass http://api:3000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        # Keep the port, so upload URLs the API builds from Host work on non-standard ports too.
        proxy_set_header Host $http_host;
        # The API trusts these (TRUST_PROXY) for the client's IP and https, used by rate limits and sessions.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Share links (/p/<project id>): a page with that project's link-preview tags, which forwards to the case study.
    location /p/ {
        proxy_pass http://api:3000/share/projects/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # RSS feed of blog posts, built by the API.
    location = /rss.xml {
        proxy_pass http://api:3000/share/rss.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Blog posts (/blog/<slug>): preview crawlers get a page with the post's preview tags from the API;
    # everyone else gets the app. The /blog list itself falls through to "location /".
    location ~ ^/blog/[^/]+/?$ {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        if ($preview_crawler) {
            rewrite ^/blog/([^/]+)/?$ /share/posts/$1 break;
            proxy_pass http://api:3000;
        }
        try_files $uri /index.html;
    }

    # Proxy static image uploads served by NestJS
    location /uploads/ {
        proxy_pass http://api:3000/uploads/;
    }
}